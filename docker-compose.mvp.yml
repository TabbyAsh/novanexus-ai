services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_dev_password
      POSTGRES_DB: nova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  eventbus:
    build:
      context: .
      dockerfile: services/eventbus/Dockerfile
    container_name: nova-eventbus
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://nova:nova_dev_password@postgres:5432/nova
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: nova-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://nova:nova_dev_password@postgres:5432/nova
      - JWT_SECRET=nova_jwt_secret_change_in_prod_32chars
      - REDIS_URL=redis://redis:6379
      - EVENTBUS_URL=http://eventbus:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eventbus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: nova-orchestrator
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://nova:nova_dev_password@postgres:5432/nova
      - REDIS_URL=redis://redis:6379
      - EVENTBUS_URL=http://eventbus:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eventbus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: nova-billing
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://nova:nova_dev_password@postgres:5432/nova
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - APP_URL=http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: nova-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth:3001
      - ORCHESTRATOR_URL=http://orchestrator:3002
      - EVENTBUS_URL=http://eventbus:3003
      - BILLING_URL=http://billing:3006
      - REDIS_URL=redis://redis:6379
    depends_on:
      auth:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      eventbus:
        condition: service_healthy
      billing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  marketdata:
    build:
      context: .
      dockerfile: services/marketdata/Dockerfile
    container_name: nova-marketdata
    ports:
      - "3020:3020"
    environment:
      - NODE_ENV=production
      - PORT=3020
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - DATABASE_URL=postgresql://nova:nova_dev_password@postgres:5432/nova
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3020/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tradebot:
    build:
      context: .
      dockerfile: services/tradebot/Dockerfile
    container_name: nova-tradebot
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - ORCHESTRATOR_URL=http://orchestrator:3002
      - MARKETDATA_URL=http://marketdata:3020
      - EVENTBUS_URL=http://eventbus:3003
      - DATABASE_URL=postgresql://nova:nova_dev_password@postgres:5432/nova
      - REDIS_URL=redis://redis:6379
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALPACA_ENDPOINT=${ALPACA_ENDPOINT:-https://paper-api.alpaca.markets/v2}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
    depends_on:
      orchestrator:
        condition: service_healthy
      marketdata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3010/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nova-web
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      gateway:
        condition: service_healthy
      tradebot:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    name: nova-network
