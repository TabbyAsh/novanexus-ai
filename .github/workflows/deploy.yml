name: Production Smoke

# Read-only checks against the public site. This file must not deploy,
# promote a Vercel build, or call Railway. GitHub runs the schedule from
# the default branch (master). Updating it here does not change that
# schedule until the file is on master, which this preview does not do.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    name: Verify Public Revenue Path
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify canonical site, copy, and intake health
        shell: bash
        run: |
          set -euo pipefail

          root_html="$(curl --fail --silent --show-error https://novanexus-ai.com/)"
          grep --fixed-strings --quiet 'Nova Enterprises LLC' <<<"$root_html"
          grep --fixed-strings --quiet 'Sourcing socks and towels from mills in Turkey and Pakistan.' <<<"$root_html"
          grep --fixed-strings --quiet 'Written quotes before you commit.' <<<"$root_html"
          grep --fixed-strings --quiet 'In development' <<<"$root_html"
          grep --fixed-strings --quiet 'wkirby592@gmail.com' <<<"$root_html"
          grep --fixed-strings --quiet '812-263-1586' <<<"$root_html"
          if grep --fixed-strings --quiet 'direct from vetted mills' <<<"$root_html"; then
            echo 'Homepage still contains a removed claim: direct from vetted mills'
            exit 1
          fi
          if grep --fixed-strings --quiet 'Low minimums' <<<"$root_html"; then
            echo 'Homepage still contains a removed claim: Low minimums'
            exit 1
          fi

          privacy_status="$(curl --silent --show-error --output /tmp/privacy.html --write-out '%{http_code}' https://novanexus-ai.com/privacy)"
          test "$privacy_status" = "200"
          grep --fixed-strings --quiet 'wkirby592@gmail.com' /tmp/privacy.html

          health_json="$(curl --fail --silent --show-error https://novanexus-ai.com/api/intake/health)"
          jq --exit-status '.ok == true and .service == "intake" and (.database | type == "string") and (.email | type == "string")' <<<"$health_json" >/dev/null

          robots="$(curl --fail --silent --show-error https://novanexus-ai.com/robots.txt)"
          grep --fixed-strings --quiet 'Sitemap: https://novanexus-ai.com/sitemap.xml' <<<"$robots"
          grep --fixed-strings --quiet 'Disallow: /owner' <<<"$robots"

          {
            echo '## Production smoke passed'
            echo
            echo '- Homepage: HTTP 200 with current company copy'
            echo '- Privacy page: HTTP 200'
            echo '- Intake health: '"$(jq --compact-output '{ok,service,database,email}' <<<"$health_json")"
          } >>"$GITHUB_STEP_SUMMARY"
