name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    name: Verify Public Revenue Path
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify canonical site, offer, and backend
        shell: bash
        run: |
          set -euo pipefail

          root_status="$(curl --fail-with-body --silent --show-error --output /dev/null --write-out '%{http_code}' https://novanexus-ai.com/)"
          test "$root_status" = "200"

          www_result="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' 'https://www.novanexus-ai.com/services/workflow-setup?source=smoke')"
          test "$www_result" = "308 https://novanexus-ai.com/services/workflow-setup?source=smoke"

          pilot_html="$(curl --fail --silent --show-error https://novanexus-ai.com/services/workflow-setup)"
          grep --fixed-strings --quiet 'Workflow Setup Pilot' <<<"$pilot_html"
          grep --fixed-strings --quiet 'Record my pilot inquiry' <<<"$pilot_html"
          grep --fixed-strings --quiet '$150' <<<"$pilot_html"

          health_json="$(curl --fail --silent --show-error https://novanexus-ai.com/api/proxy/health)"
          jq --exit-status '.status == "healthy" and .service == "gateway"' <<<"$health_json" >/dev/null

          version_json="$(curl --fail --silent --show-error "https://novanexus-ai.com/api/version?smoke=${GITHUB_RUN_ID}")"
          jq --exit-status '.environment == "production" and .vercelEnv == "production" and (.gitSha | type == "string" and length >= 7 and . != "dev")' <<<"$version_json" >/dev/null

          robots="$(curl --fail --silent --show-error https://novanexus-ai.com/robots.txt)"
          grep --fixed-strings --quiet 'Sitemap: https://novanexus-ai.com/sitemap.xml' <<<"$robots"

          sitemap="$(curl --fail --silent --show-error https://novanexus-ai.com/sitemap.xml)"
          grep --fixed-strings --quiet '<loc>https://novanexus-ai.com/services/workflow-setup</loc>' <<<"$sitemap"

          deployed_sha="$(jq --raw-output '.gitSha' <<<"$version_json")"
          {
            echo '## Production smoke passed'
            echo
            echo "- Canonical site: HTTP ${root_status}"
            echo '- Revenue offer: present'
            echo '- Railway gateway: healthy through same-origin proxy'
            echo "- Deployed source: ${deployed_sha}"
          } >>"$GITHUB_STEP_SUMMARY"
