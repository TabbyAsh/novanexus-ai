name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, codex/revenue-doorway-hardening]
  pull_request:
    branches:
      - master
      - codex/revenue-doorway-hardening
      - agent/realize-nova-interaction-engine

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Typecheck, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_ci_password
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nova"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://nova:nova_ci_password@localhost:5432/nova
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Run database migrations
        run: |
          for f in infra/migrations/*.sql; do
            echo "Running migration: $f"
            psql -X "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          PGPASSWORD: nova_ci_password

      - name: Verify economic Trade migration strictly
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/migrations/034_economic_trade_operating_spine.sql
        env:
          PGPASSWORD: nova_ci_password

      - name: Billing PostgreSQL revenue safety tests
        run: npm test --workspace @nova/billing-service -- --runInBand revenue-safety.postgres.test.ts
        env:
          BILLING_POSTGRES_TESTS: 'true'

      - name: Build all packages
        run: npx turbo run build --no-cache

      - name: Typecheck
        # tradebot excluded: uses esbuild not tsc, has pre-existing TS2339 type errors (SYSTEM_STATUS.md #2)
        # All other services must pass strict typecheck
        run: npx turbo run typecheck --filter='!@nova/tradebot'

      - name: Economic Trade tests
        run: npm test --workspace @nova/nova-hub -- --runInBand economic-trade

      - name: Lint
        run: npx turbo run lint

      - name: Test
        run: npx turbo run test

      - name: Verify production bundles (esbuild)
        run: |
          echo "=== Building production bundles ==="
          npx esbuild services/gateway/src/index.ts --bundle --platform=node --target=node20 --outfile=/tmp/gateway.js --external:pg-native --tsconfig=services/gateway/tsconfig.json
          npx esbuild services/auth/src/index.ts --bundle --platform=node --target=node20 --outfile=/tmp/auth.js --external:pg-native --external:bcryptjs --tsconfig=services/auth/tsconfig.json
          npx esbuild services/nova-hub/src/index.ts --bundle --platform=node --target=node20 --outfile=/tmp/nova-hub.js --external:pg-native --external:openai --tsconfig=services/nova-hub/tsconfig.json
          npx esbuild services/billing/src/index.ts --bundle --platform=node --target=node20 --outfile=/tmp/billing.js --external:pg-native --external:stripe --tsconfig=services/billing/tsconfig.json
          npx esbuild services/scheduler/src/index.ts --bundle --platform=node --target=node20 --outfile=/tmp/scheduler.js --external:pg-native --tsconfig=services/scheduler/tsconfig.json
          echo "=== All production bundles verified ==="

      - name: Build summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **npm**: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
