"Room hire and other costs paid regardless of attendance."}],"outputs":[{"id":"remaining","label":"Budget remaining","unit":"USD","expression":{"op":"subtract","args":[{"ref":"revenue"},{"ref":"totalCost"}]},"precision":2,"help":"Revenue minus total costs. A negative value is a shortfall."},{"id":"breakEven","label":"Attendees to break even","unit":"item","expression":{"op":"ceil","args":[{"op":"divide","args":[{"ref":"fixedCost"},{"op":"subtract","args":[{"ref":"price"},{"ref":"variableCost"}]}]}]},"precision":0,"help":"Fixed costs ÷ contribution per attendee, rounded up to the next whole attendee."},{"id":"revenue","label":"Ticket revenue","unit":"USD","expression":{"op":"multiply","args":[{"ref":"attendees"},{"ref":"price"}]},"precision":2,"help":"Paid attendees × ticket price."},{"id":"totalCost","label":"Total costs","unit":"USD","expression":{"op":"add","args":[{"ref":"fixedCost"},{"op":"multiply","args":[{"ref":"attendees"},{"ref":"variableCost"}]}]},"precision":2,"help":"Fixed costs + (attendees × cost per attendee)."}],"constraints":[{"id":"positiveContribution","left":{"ref":"price"},"operator":"gt","right":{"ref":"variableCost"},"message":"Ticket price must exceed cost per attendee to calculate a break-even attendance. Raise the price or lower the per-person cost.","severity":"error"},{"id":"covered","left":{"ref":"remaining"},"operator":"gte","right":{"value":0,"unit":"USD"},"message":"This attendance does not cover the stated costs. The negative remaining budget is the shortfall.","severity":"warning"}],"chart":{"title":"Revenue and costs","unit":"USD","series":[{"label":"Ticket revenue","ref":"revenue"},{"label":"Total costs","ref":"totalCost"}]}},"values":{"attendees":40,"price":10,"variableCost":10,"fixedCost":300}}</script><script>"use strict";const engine=(function createInstrumentEngine() {
