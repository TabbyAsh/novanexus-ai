# Railway deployment configuration for NovaNexus Backend
# Docs: https://docs.railway.app/reference/config-as-code
#
# Dockerfile.prod builds all services and runs them via PM2.
# The Dockerfile CMD (/app/start.sh) handles:
#   1. Environment validation
#   2. Database migrations
#   3. PM2-runtime with the service set in ecosystem.config.js

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.prod"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
